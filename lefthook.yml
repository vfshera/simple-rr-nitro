pre-commit:
  parallel: true
  commands:
    format:
      glob: "**/*.{js,ts,mjs,cjs,json,md,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    lint:
      glob: "**/*.{js,ts,mjs,cjs}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
